[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdc-claw"
version = "1.0.0"
description = "Pure-Python HarmonyOS NEXT / 6.0 HDC Wireless Protocol Client & AI Agent Automation Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "encauporce", email = "chuangshidada803@qq.com" }
]
keywords = [
    "harmonyos",
    "harmonyos-next",
    "openharmony",
    "hdc",
    "agent",
    "automation",
    "uinput",
    "llm",
    "vlm",
    "ai-agent",
    "adb",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=3.4.0",
    "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/encauporce/HDC-Claw"
Repository = "https://github.com/encauporce/HDC-Claw.git"
Issues = "https://github.com/encauporce/HDC-Claw/issues"

[project.scripts]
hdc-claw = "hdc_claw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
